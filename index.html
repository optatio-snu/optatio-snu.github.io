<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f9" />
  <meta name="description" content="문서, 이미지, 스프레드시트 등을 한곳에서 찾아보고 공유하는 개인 문건함" />
  <title>문건함</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">DOCUMENT VAULT</p>
        <h1 id="site-title">문건함</h1>
        <p id="site-description" class="subtitle">PDF, HWP, 이미지, 엑셀 등 자주 공유하는 파일을 한곳에 모아둡니다.</p>
      </div>
      <a id="repo-link" class="repo-link hidden" href="#" target="_blank" rel="noreferrer">GitHub ↗</a>
    </header>

    <main>
      <section class="toolbar" aria-label="파일 찾기">
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="파일명, 폴더명, 확장자로 검색" autocomplete="off" />
        </div>
        <select id="sort" aria-label="정렬">
          <option value="newest">최근 수정순</option>
          <option value="name">이름순</option>
          <option value="size">큰 파일순</option>
        </select>
      </section>

      <section class="chips" id="chips" aria-label="파일 종류 필터"></section>

      <section class="summary-row">
        <p id="summary">파일을 불러오는 중…</p>
        <button id="copy-page-link" class="text-button" type="button">이 페이지 링크 복사</button>
      </section>

      <section id="file-grid" class="file-grid" aria-live="polite"></section>

      <section id="empty-state" class="empty-state hidden">
        <div class="empty-icon">∅</div>
        <h2>보이는 파일이 없어요</h2>
        <p>검색어를 바꾸거나 다른 분류를 눌러봐.</p>
      </section>
    </main>

    <footer>
      <span>GitHub Pages로 만든 정적 문건함</span>
      <span>•</span>
      <span>파일은 이 저장소의 <code>files/</code> 폴더에서 관리됩니다.</span>
    </footer>
  </div>

  <dialog id="preview-dialog">
    <div class="dialog-head">
      <div>
        <p class="eyebrow">PREVIEW</p>
        <h2 id="preview-title">미리보기</h2>
      </div>
      <button id="close-preview" class="icon-button" type="button" aria-label="미리보기 닫기">×</button>
    </div>
    <div id="preview-body" class="preview-body"></div>
    <div class="dialog-actions">
      <a id="preview-download" class="primary-button" href="#" download>다운로드</a>
      <button id="preview-copy" class="secondary-button" type="button">파일 링크 복사</button>
    </div>
  </dialog>

  <script src="./site.config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
